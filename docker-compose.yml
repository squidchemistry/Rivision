# Rivision with its own Postgres.
#   Demo (no API key needed):   docker compose up --build        -> http://localhost:3000
#   Real AI:                    GROQ_API_KEY=... DEMO_MODE=false DEMO_SEED=false NEXTAUTH_SECRET=... docker compose up --build
# Only Postgres on its own (for npm run dev): docker compose up db
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rivision
      POSTGRES_PASSWORD: rivision
      POSTGRES_DB: rivision
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivision -d rivision"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://rivision:rivision@db:5432/rivision
      DIRECT_URL: postgresql://rivision:rivision@db:5432/rivision
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:${APP_PORT:-3000}}
      # Demo default only: set a real secret (openssl rand -base64 32) for anything public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-demo-secret-change-me-before-sharing}
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_SEED: ${DEMO_SEED:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
